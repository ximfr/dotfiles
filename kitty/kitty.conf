# ==============================================================================
# FONTS
# ==============================================================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Text rendering / Line height
adjust_line_height  110%
disable_ligatures   never

# ==============================================================================
# WINDOW LAYOUT & PADDING
# ==============================================================================
window_padding_width  12
confirm_os_window_close 0

# Hide titlebar / decorations for Wayland/Hyprland
hide_window_decorations yes

# Background transparency & blur (works natively on Hyprland)
background_opacity 0.90

# ==============================================================================
# CURSOR & MOUSE
# ==============================================================================
cursor_shape          beam
cursor_blink_interval 0.5
mouse_hide_wait       3.0
detect_urls           yes
url_style             curly

# ==============================================================================
# PERFORMANCE & AUDIO
# ==============================================================================
enable_audio_bell no
repaint_delay     10
input_delay       3
sync_to_monitor   yes

# ==============================================================================
# TAB BAR
# ==============================================================================
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
active_tab_font_style   bold
inactive_tab_font_style normal

# ==============================================================================
# KEYBINDINGS
# ==============================================================================
# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font sizing
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# Tabs
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+tab     next_tab
map ctrl+shift+tab previous_tab

# ==============================================================================
# COLOR THEME
# ==============================================================================
# You can include themes managed by `kitty +kitten themes`
include current-theme.confY
